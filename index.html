<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>VisionQuest | Image Search</title>
    <link rel="stylesheet" href="styles.css" />
</head>
<body>
    <!-- Sticky header (Original Feature 1) -->
    <header class="sticky-header">
        <div class="header-container">
            <h1>VisionQuest</h1>
            <p class="tagline">Discover the world's visuals in one click.</p>
        </div>
    </header>

    <main>
        <section class="search-section">
            <form id="search-form" class="search-form">
                <label for="search-input" class="visually-hidden">Search for images</label>
                <div class="search-input-group">
                    <input id="search-input" type="search" placeholder="E.g., mountains, futuristic city..." />
                    <button id="search-btn" type="submit">Search</button>
                </div>
            </form>

            <!-- Category chips (Original Feature 2) -->
            <div class="suggestion-chips">
                <button type="button" class="chip">Nature</button>
                <button type="button" class="chip">Architecture</button>
                <button type="button" class="chip">Animals</button>
                <button type="button" class="chip">Abstract</button>
            </div>
        </section>

        <section class="results-section">
            <!-- Empty state message / status placeholder (Original Feature 3) -->
            <p id="status" class="status-message">Ready to explore. Search to see results.</p>
            
            <!-- Empty results container with responsive grid -->
            <div id="results" class="results-grid"></div>
        </section>
    </main>

    <!-- Script loaded just before closing body -->
    <script src="script.js"></script>
</body>
</html>
